openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0
  description: API dang ky, dang nhap, profile, nhan vien va users.
servers:
  - url: /
    description: Current Auth Service host
tags:
  - name: Auth
  - name: Profile
  - name: Staff
  - name: Users
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Dang ky tai khoan khach hang
      requestBody:
        $ref: "#/components/requestBodies/Register"
      responses:
        "201":
          $ref: "#/components/responses/MessageSuccess"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Dang nhap
      requestBody:
        $ref: "#/components/requestBodies/Login"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Cap access token moi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/TokenSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Dang xuat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Gui yeu cau quen mat khau
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          $ref: "#/components/responses/SimpleMessage"
        "400":
          $ref: "#/components/responses/SimpleError"
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Dat lai mat khau
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        "200":
          $ref: "#/components/responses/SimpleMessage"
        "400":
          $ref: "#/components/responses/SimpleError"
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Doi mat khau
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        "200":
          $ref: "#/components/responses/SimpleMessage"
        "400":
          $ref: "#/components/responses/SimpleError"
  /api/v1/profile/me:
    get:
      tags: [Profile]
      summary: Lay profile cua token hien tai
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Error"
    put:
      tags: [Profile]
      summary: Cap nhat profile cua token hien tai
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/staff:
    get:
      tags: [Staff]
      summary: Lay danh sach nhan vien
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Staff"
    post:
      tags: [Staff]
      summary: Tao nhan vien
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          $ref: "#/components/responses/MessageSuccess"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/staff/search:
    get:
      tags: [Staff]
      summary: Tim kiem nhan vien
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff search list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Staff"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/staff/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Staff]
      summary: Lay nhan vien theo id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Staff detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Staff"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [Staff]
      summary: Cap nhat nhan vien
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/staff/{id}/deactivate:
    patch:
      tags: [Staff]
      summary: Vo hieu hoa nhan vien
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"
  /api/v1/users:
    get:
      tags: [Users]
      summary: Lay danh sach users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/users/search:
    get:
      tags: [Users]
      summary: Tim kiem users
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User search list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Users]
      summary: Lay user theo id
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Users]
      summary: Xoa user neu status inactive
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegisterRequest"
    Login:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LoginRequest"
  responses:
    MessageSuccess:
      description: Successful message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
    TokenSuccess:
      description: Token response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
    SimpleMessage:
      description: Message response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SimpleMessage"
    SimpleError:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SimpleMessage"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    RegisterRequest:
      type: object
      required: [full_name, phone_number, email, password]
      additionalProperties: false
      properties:
        full_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Email hoac so dien thoai.
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          properties:
            user_id:
              type: integer
            full_name:
              type: string
            email:
              type: string
              format: email
            phone_number:
              type: string
            role:
              type: string
    Profile:
      type: object
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        role:
          type: string
          enum: [admin, staff, customer]
        status:
          type: string
          enum: [active, inactive]
        avatar:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
        avatar:
          type: string
        address:
          type: string
    CreateStaffRequest:
      type: object
      required: [full_name, email, phone_number, password, role, position]
      additionalProperties: false
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [admin, staff]
        position:
          type: string
        license_number:
          type: string
    UpdateStaffRequest:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
        position:
          type: string
        license_number:
          type: string
    Staff:
      type: object
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
        phone_number:
          type: string
        role:
          type: string
          enum: [admin, staff]
        status:
          type: string
          enum: [active, inactive]
        employee_id:
          type: integer
        position:
          type: string
          nullable: true
        license_number:
          type: string
          nullable: true
    User:
      type: object
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, staff, customer]
        status:
          type: string
          enum: [active, inactive]
        avatar:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    SimpleMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
